<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>FibonacciGrid</title>
<style>html,body{margin:0} body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);padding:21px} .row{display:flex;flex-wrap:wrap;gap:13px;align-items:center} .stack{display:grid;gap:21px}</style>
</head>
<body>
<div class="dp-fib" role="group" aria-label="DevFest Pisa key facts">
  <div class="dp-fib__s5" style="background:var(--surface-raised)">
    <div style="font:700 89px/0.95 var(--font-numeral);letter-spacing:-0.03em;color:var(--red)">2027</div>
    <div style="font:500 21px/28px var(--font-sans)">From abacus to AI</div>
  </div>
  <div class="dp-fib__s3" style="background:var(--pastel-blue);color:var(--on-pastel)">
    <div style="font:700 13px/21px var(--font-sans);letter-spacing:.08em">WHERE</div>
    <div style="font:500 21px/28px var(--font-sans)">Pisa</div>
  </div>
  <div class="dp-fib__s2" style="background:var(--yellow);color:var(--on-pastel)"><div style="font:700 34px/1 var(--font-numeral)">1202</div></div>
  <div class="dp-fib__s1a" style="background:var(--green)"></div>
  <div class="dp-fib__s1b" style="background:var(--blue)"></div>
  <svg class="dp-fib__spiral" viewBox="0 0 8 5" preserveAspectRatio="none" aria-hidden="true"><path d="M0 5 A5 5 0 0 1 5 0 A3 3 0 0 1 8 3 A2 2 0 0 1 6 5 A1 1 0 0 1 5 4 A1 1 0 0 1 6 3"/></svg>
</div>
</body>
</html>
