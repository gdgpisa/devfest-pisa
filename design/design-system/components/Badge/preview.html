<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Badge</title>
<style>html,body{margin:0} body{background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>
</head>
<body>
<div style="padding:21px;display:flex;justify-content:center">
  <div class="dp-badge" role="img" aria-label="DevFest Pisa 2027 badge">
    <div style="grid-column:1/6;grid-row:1/6;justify-content:flex-end;align-items:flex-end;border-right:2px solid var(--ink)"><img src="../../assets/Logos/devfest-lockup-trim.png" alt="" style="width:150px;height:auto;display:block"></div>
    <div style="grid-column:6/9;grid-row:1/4;background:var(--blue);color:var(--on-blue);justify-content:flex-end;border-bottom:2px solid var(--ink);font:700 28px/1 var(--font-sans);letter-spacing:-0.03em">Pisa</div>
    <div style="grid-column:7/9;grid-row:4/6;background:var(--yellow);color:var(--on-pastel);border-left:2px solid var(--ink);font:700 17px/1 var(--font-sans)">2027</div>
    <div style="grid-column:6/7;grid-row:4/5;background:var(--green);border-bottom:2px solid var(--ink)"></div>
    <div style="grid-column:6/7;grid-row:5/6;background:var(--red)"></div>
    <svg class="dp-hero__spiral" viewBox="0 0 8 5" preserveAspectRatio="none" aria-hidden="true"><path d="M0 5 A5 5 0 0 1 5 0 A3 3 0 0 1 8 3 A2 2 0 0 1 6 5 A1 1 0 0 1 5 4 A1 1 0 0 1 6 3"></path></svg>
  </div>
</div>
</body>
</html>
