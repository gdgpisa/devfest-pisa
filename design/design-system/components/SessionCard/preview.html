<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>SessionCard</title>
<style>html,body{margin:0} body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);padding:21px} .row{display:flex;flex-wrap:wrap;gap:13px;align-items:center} .stack{display:grid;gap:21px}</style>
</head>
<body>
<div class="stack">
<article class="dp-session">
  <div class="dp-session__time">09:30</div>
  <div class="dp-session__body">
    <h3 class="dp-session__title">Building agents with Gemini and Firebase</h3>
    <p class="dp-session__speaker">Giulia Rossi <span>· GDE Firebase</span></p>
    <div class="dp-session__meta"><span class="dp-tag dp-tag--ai">AI</span><span>Aula Magna · 45 min</span></div>
  </div>
</article>
<article class="dp-session">
  <div class="dp-session__time dp-session__time--now">11:00</div>
  <div class="dp-session__body">
    <h3 class="dp-session__title">Kotlin Multiplatform in production</h3>
    <p class="dp-session__speaker">Marco Bianchi <span>· Android engineer</span></p>
    <div class="dp-session__meta"><span class="dp-tag dp-tag--mobile">Mobile</span><span>Aula B · 30 min</span></div>
  </div>
</article>
</div>
</body>
</html>
